[workspace]
resolver = "2"
members = [
    "crates/nahpu-embed-core",
    "crates/nahpu-embed-burn",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nahpu/nahpu-ai"

[workspace.dependencies]
anyhow = "1"
nahpu-embed-core = { path = "crates/nahpu-embed-core" }
nahpu-embed-burn = { path = "crates/nahpu-embed-burn" }
burn = { version = "0.21", default-features = false, features = ["std"] }

# Unoptimised tensor kernels make debug runs unusably slow (47x here), while our
# own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
