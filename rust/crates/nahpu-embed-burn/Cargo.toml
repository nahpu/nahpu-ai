[package]
name = "nahpu-embed-burn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Burn-backed embedding engines for NAHPU AI experiments."

[features]
# Pure-Rust CPU backend. Default because it needs no system library and no
# per-OS build flags, which is the portability the framework choice rests on.
default = ["flex"]
flex = ["burn/flex"]
# GPU backends stay opt-in so a plain `cargo build` stays light.
wgpu = ["burn/wgpu"]
metal = ["burn/metal"]
vulkan = ["burn/vulkan"]

[dependencies]
nahpu-embed-core.workspace = true
anyhow.workspace = true
burn.workspace = true
burn-store = "0.21"
tokenizers = "0.21"

[build-dependencies]
burn-onnx = "0.21"
